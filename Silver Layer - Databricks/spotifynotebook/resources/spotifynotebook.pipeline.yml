# The main pipeline for spotifynotebook
resources:
  pipelines:
    spotifynotebook_pipeline:
      name: spotifynotebook_pipeline
      catalog: dbnew
      schema: spotifynotebook_${bundle.target}
      serverless: true
      libraries:
        - notebook:
            path: ../src/pipeline.ipynb

      configuration:
        bundle.sourcePath: ${workspace.file_path}/src
